<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - EasyRecipe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="auth-container">
        <h1>Crear Cuenta</h1>

        <div id="error-message" class="error-message"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Mínimo 6 caracteres"
            />
          </div>

          <button type="submit" class="btn">Registrarse</button>
        </form>

        <p class="auth-link">
          ¿Ya tienes cuenta? <a href="/login">Iniciar Sesión</a>
        </p>
      </div>
    </div>

    <script>
      // Verificar si ya hay un token JWT almacenado
      const token = localStorage.getItem('token');
      if (token) {
        // Redireccionar al dashboard si ya hay token
        window.location.href = '/dashboard';
      }

      // Configurar envío del formulario
      const registerForm = document.getElementById('register-form');
      const errorDisplay = document.getElementById('error-message');

      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        errorDisplay.textContent = '';

        // Validaciones básicas
        if (password.length < 6) {
          errorDisplay.textContent =
            'La contraseña debe tener al menos 6 caracteres';
          return;
        }

        try {
          const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, email, password }),
          });

          const data = await response.json();

          if (data.success) {
            // Redireccionar al login
            alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
            window.location.href = '/login';
          } else {
            errorDisplay.textContent = data.message || 'Error al registrarse';
          }
        } catch (error) {
          console.error('Error en registro:', error);
          errorDisplay.textContent = 'Error de conexión, intente nuevamente';
        }
      });
    </script>
  </body>
</html>
